services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prestamos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-prestamos}
      POSTGRES_DB: prestamos
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prestamos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://prestamos:${DB_PASSWORD:-prestamos}@db:5432/prestamos
    ports:
      - "8000:8000"

volumes:
  db_data:
